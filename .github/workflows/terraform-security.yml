name: Terraform Security Scan

on:
  pull_request:
    branches: [main]
    paths: ['**.tf']
  push:
    branches: [main]
    paths: ['**.tf']
  schedule:
    # 毎週月曜 09:00 JST
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Checkov + tflint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
          # テスト用途で意図的に許容している検出は除外する
          # CKV_AZURE_109: Key Vault のネットワーク制限（テスト用に Allow）
          # CKV_AZURE_110: Key Vault パージ保護（destroy 可能にするため無効）
          # CKV_AZURE_similar は必要に応じて追加
          skip_check: CKV_AZURE_109,CKV_AZURE_110,CKV2_AZURE_32

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
        continue-on-error: true

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run tflint
        run: |
          tflint --init
          tflint --format compact --recursive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
